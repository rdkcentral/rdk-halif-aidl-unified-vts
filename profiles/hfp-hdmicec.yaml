# HAL Feature Profile for cec


hdmicec:                        # Component object begins
    interfaceVersion: 0.2.0.0
    HAL_CEC_VERSION: x06    # x04 = Version 1.3a
                            # x05 = Version 1.4, Version 1.4a or Version 1.4b
                            # x06 = Version 2.0
                            # See HDMI specification [CEC Version] operand definition.
    PRIMARY_DEVICE_TYPE: TV
    SECONDARY_DEVICE_TYPE: NONE
    # Required DeviceType symbols: NONE, TV, RECORDING_DEVICE, TUNER,
    # PLAYBACK_DEVICE, AUDIO_SYSTEM, CEC_SWITCH, PROCESSOR.
    # NONE means no secondary address. Two addresses require TV or AUDIO_SYSTEM
    # paired with PLAYBACK_DEVICE or RECORDING_DEVICE (HDMI 2.0 Table 11-8).
