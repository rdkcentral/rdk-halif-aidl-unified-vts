# =============================================================================
# TRICK MODES & SEEK TEST CASES
# Covers: Pause/Resume, Fast-Forward, Rewind, Seek operations
# Includes: AV Playback, Audio Only, Video Only
# =============================================================================

AVModule:
  input_streams_path: assets/streams/input
  player: gstreamer
  L4Test:
