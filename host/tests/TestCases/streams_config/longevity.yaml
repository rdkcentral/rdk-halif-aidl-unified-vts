# =============================================================================
# PERFORMANCE & LONGEVITY TEST CASES
# Purpose: Validate decoder stability, memory management, and performance
# consistency during extended playback (2 hours)
# =============================================================================

AVModule:
  input_streams_path: assets/streams/input
  player: gstreamer
  L4Test:
  # ---------------------------------------------------------------------------
  # 1.5 Performance & Longevity - Extended Playback
  # ---------------------------------------------------------------------------

  # Implementation of playing the streams with usb is in progress because of the size of the Longevity streams.

  - tcid: VTS_L4_H264_AAC_1101
    use_case: "Performance & Longevity"
    action: normal_play
    codec: "H.264 AAC"
    duration: "2 hours"
    stream_name: "Audio_Video/Long_Duration/vts_h264_1080p_sdr_60.0f_BT709_yuv420p_12M_aac_48k_2ch_256k_a337501_v432000_7200sec.mp4"

  - tcid: VTS_L4_H265_EAC3_1102
    use_case: "Performance & Longevity"
    action: normal_play
    codec: "H.265 EAC3"
    duration: "2 hours"
    stream_name: "Audio_Video/Long_Duration/vts_h265_2160p_hdr10_60.0f_BT2020_yuv420p_25M_eac3_48k_6ch_512k_a225000_v432000_7200sec.mp4"

  - tcid: VTS_L4_VP9_OPUS_1103
    use_case: "Performance & Longevity"
    action: normal_play
    codec: "VP9 OPUS"
    duration: "2 hours"
    stream_name: "Audio_Video/Long_Duration/vts_vp9_1080p_sdr_60.0f_BT709_yuv420p_15M_opus_48k_2ch_256k_a359778_v432000_7201sec.webm"

  - tcid: VTS_L4_AV1_AAC_1104
    use_case: "Performance & Longevity"
    action: normal_play
    codec: "AV1 AAC"
    duration: "2 hours"
    stream_name: "Audio_Video/Long_Duration/vts_av1_2160p_sdr_30.0f_BT709_yuv420p_20M_aac_48k_2ch_256k_a337292_v216000_7200sec.mp4"
