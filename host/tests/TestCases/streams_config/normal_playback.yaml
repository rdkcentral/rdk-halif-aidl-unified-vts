# =============================================================================
# NORMAL PLAYBACK TEST CASES
# Covers: AV Playback, Audio Only, Video Only
# Includes: Baseline, HDR Metadata, Pixel Formats, Interlaced, Low Bitrate, ABR
# =============================================================================

AVModule:
  input_streams_path: assets/streams/input
  player: gstreamer
  L4Test:
  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Baseline AV Playback HD
  # Purpose: Validate complete decoder lifecycle including open/start/decode/
  # queue operations, callback handling, stop/flush/EOS sequences, and basic
  # audio-video synchronization
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H264_AC3_1001
    use_case: "Baseline AV Playback HD"
    action: normal_play
    codec: "H264 AC3"
    stream_name: "Audio_Video/HD/vts_h264_1080p_sdr_60.0f_BT709_yuv420p_8M_ac3_48k_6ch_512k_a1875_v3600_60sec.mp4"

  - tcid: VTS_L4_H265_EAC3_1001
    use_case: "Baseline AV Playback HD"
    action: normal_play
    codec: "H265 EAC3"
    stream_name: "Audio_Video/HD/vts_h265_1080i_sdr_60.0f_BT709_yuv420p_8M_eac3_48k_6ch_512k_a1875_v3600_60sec.mp4"

  - tcid: VTS_L4_MPEG2_AAC_1001
    use_case: "Baseline AV Playback HD"
    action: normal_play
    codec: "MPEG2 AAC"
    stream_name: "Audio_Video/HD/vts_mpeg2_1080p_sdr_60.0f_BT709_yuv420p_20M_aac_48k_6ch_256k_a2814_v3600_60sec.mp4"

  - tcid: VTS_L4_VP9_AAC_1001
    use_case: "Baseline AV Playback HD"
    action: normal_play
    codec: "VP9 AAC"
    stream_name: "Audio_Video/HD/vts_vp9_1080p_sdr_60.0f_BT709_yuv420p_15M_aac_48k_2ch_512k_a2814_v3600_60sec.mp4"

  - tcid: VTS_L4_AV1_AAC_1001
    use_case: "Baseline AV Playback HD"
    action: normal_play
    codec: "AV1 AAC"
    stream_name: "Audio_Video/HD/vts_av1_1080p_sdr_30.0f_BT709_yuv420p_10M_aac_48k_2ch_256k_a2814_v1800_60sec.mp4"

  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - HDR Metadata Propagation
  # Purpose: Validate proper propagation of DynamicRange and ColorPrimaries
  # metadata via FrameMetadata callbacks. This test focuses on metadata
  # accuracy, not subjective picture quality.
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_HDR10_2001
    use_case: "HDR Metadata Propagation"
    action: normal_play
    hdr_mode: "HDR10"
    stream_name: "Audio_Video/HDR/vts_h265_2160p_hdr10_60.0f_BT2020_yuv420p_20M_eac3_48k_6ch_512k_a1875_v3600_60sec.mp4"

  - tcid: VTS_L4_HDR10P_2001
    use_case: "HDR Metadata Propagation"
    action: normal_play
    hdr_mode: "HDR10+"
    stream_name: "Audio_Video/HDR/vts_h265_2160p_hdr10+_60.0f_BT2020_yuv420p_20M_eac3_48k_6ch_512k_a1875_v3600_60sec.mp4"

  - tcid: VTS_L4_HLG_2001
    use_case: "HDR Metadata Propagation"
    action: normal_play
    hdr_mode: "HLG"
    stream_name: "Audio_Video/HDR/vts_h265_2160p_hlg_60.0f_BT2020_yuv420p_20M_ac3_48k_6ch_512k_a1875_v3600_60sec.mp4"

  - tcid: VTS_L4_SDR_2001
    use_case: "HDR Metadata Propagation"
    action: normal_play
    hdr_mode: "SDR"
    stream_name: "Audio_Video/HDR/vts_vp9_2160p_sdr_60.0f_BT2020_yuv420p_20M_opus_48k_6ch_512k_a3001_v3600_61sec.webm"

  - tcid: VTS_L4_DVISION_2001
    use_case: "HDR Metadata Propagation"
    action: normal_play
    hdr_mode: "Dolby Vision"                                      # Dolby Licensed Stream
    stream_name: "Audio_Video/HDR/H265_DolbyVision.mp4"

  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Pixel Format Coverage
  # Purpose: Validate correct handling of various pixel formats to detect
  # issues in format negotiation, buffer layout, and sink compatibility
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_YUV422_3001
    use_case: "Pixel Format Coverage"
    action: normal_play
    pixel_format: "YUV422"
    stream_name: "Video/Pixel_Format/vts_h265_2160p_sdr_60.0f_BT2020_yuv422p_25M_a0_v3600_60sec.mp4"

  - tcid: VTS_L4_YUV444_3001
    use_case: "Pixel Format Coverage"
    action: normal_play
    pixel_format: "YUV444"
    stream_name: "Audio_Video/Pixel_Format/vts_av1_1080p_sdr_60.0f_BT709_yuv444p_12M_aac_48k_2ch_256k_a2814_v3600_60sec.mp4"

  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Interlaced Signaling
  # Purpose: Validate correct scan type signaling and decoder state stability
  # when handling interlaced content. This test focuses on metadata accuracy,
  # not deinterlacing quality.
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_1080i_4001
    use_case: "Interlaced Signaling"
    action: normal_play
    scan_type: "1080i MPEG-2"
    stream_name: "Audio_Video/Interlaced/vts_mpeg2_1080i_sdr_60.0f_BT709_yuv420p_20M_aac_48k_6ch_256k_a2814_v3600_60sec.mp4"

  - tcid: VTS_L4_1080i_4002
    use_case: "Interlaced Signaling"
    action: normal_play
    scan_type: "1080i H.264"
    stream_name: "Audio_Video/Interlaced/vts_h264_1080i_sdr_29.97f_BT709_yuv420p_5M_ac3_48k_6ch_256k_a1875_v1799_61sec.mp4"

  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Low Bitrate
  # Purpose: Validate decoder behavior under constrained data rates, including
  # buffer queueing, underflow tolerance, and proper EOS handling
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H264_AAC_5001
    use_case: "Low Bitrate"
    action: normal_play
    codec: "H.264 AAC"
    stream_name: "Audio_Video/Low_Bitrate/vts_h264_480p_sdr_24.0f_BT709_yuv420p_2.5M_aac_48k_2ch_512k_a2814_v1440_60sec.mp4"

  - tcid: VTS_L4_H265_AC3_5001
    use_case: "Low Bitrate"
    action: normal_play
    codec: "H.265 AC3"
    stream_name: "Audio_Video/Low_Bitrate/vts_h265_1080p_sdr_24.0f_BT709_yuv420p_2.5M_ac3_48k_2ch_256k_a1875_v1440_60sec.mp4"

  - tcid: VTS_L4_MPEG2_AAC_5001
    use_case: "Low Bitrate"
    action: normal_play
    codec: "MPEG-2 AAC"
    stream_name: "Audio_Video/Low_Bitrate/vts_mpeg2_480p_sdr_24.0f_BT709_yuv420p_2.5M_aac_48k_2ch_128k_a2814_v1440_60sec.mp4"

  - tcid: VTS_L4_VP9_AAC_5001
    use_case: "Low Bitrate"
    action: normal_play
    codec: "VP9 AAC"
    stream_name: "Audio_Video/Low_Bitrate/vts_vp9_480p_sdr_24.0f_BT709_yuv420p_2.5M_aac_48k_2ch_512k_a2814_v1440_60sec.mp4"

  - tcid: VTS_L4_AV1_AAC_5001
    use_case: "Low Bitrate"
    action: normal_play
    codec: "AV1 AAC"
    stream_name: "Audio_Video/Low_Bitrate/vts_av1_480p_sdr_24.0f_BT709_yuv420p_2.5M_aac_48k_2ch_128k_a2814_v1440_60sec.mp4"

  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Adaptive Bitrate (ABR) Streaming
  # Purpose: Validate seamless bitrate and resolution switching (Dynamic
  # Resolution Switching) during playback, simulating adaptive streaming
  # scenarios where streams transition between different quality levels
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H264_AAC_6001
    use_case: "Adaptive Bitrate (ABR)"
    action: normal_play
    codec: "H.264 AAC"
    stream_name: "Audio_Video/ABR/vts_h264_variable_sdr_30.0f_BT709_yuv420p_abr_aac_48k_6ch_abr_a14080_v9000_300sec.mp4"

  - tcid: VTS_L4_H265_EAC3_6001
    use_case: "Adaptive Bitrate (ABR)"
    action: normal_play
    codec: "H.265 EAC3"
    stream_name: "Audio_Video/ABR/vts_h265_variable_hdr10_60.0f_BT2020_yuv420p_abr_eac3_48k_6ch_abr_a9380_v18000_300sec.mp4"

  - tcid: VTS_L4_VP9_OPUS_6001
    use_case: "Adaptive Bitrate (ABR)"
    action: normal_play
    codec: "VP9 OPUS"
    stream_name: "Audio_Video/ABR/vts_vp9_variable_sdr_60.0f_BT709_yuv420p_abr_opus_48k_6ch_abr_a15010_v18000_300sec.webm"

  - tcid: VTS_L4_H264_AC3_6001
    use_case: "Adaptive Bitrate (ABR)"
    action: normal_play
    codec: "H.264 AC3"
    stream_name: "Audio_Video/ABR/vts_h264_variable_sdr_59.94f_BT709_yuv420p_abr_ac3_48k_6ch_abr_a9380_v17985_300sec.mp4"

  - tcid: VTS_L4_H265_AC3_6001
    use_case: "Adaptive Bitrate (ABR)"
    action: normal_play
    codec: "H.265 AC3"
    stream_name: "Audio_Video/ABR/vts_h265_variable_sdr_25.0f_BT709_yuv420p_abr_ac3_48k_6ch_abr_a9380_v7500_300sec.mp4"

  # ===========================================================================
  # 2.0 AUDIO ONLY PLAYBACK WITH SECURE AND NON-SECURE
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 2.1 Audio Only - Normal Playback
  # Purpose: Validate audio-only decode pipeline including buffer queueing,
  # flushing, EOS handling, and decoder state transitions across various
  # audio codecs and sample rates
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_AAC_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "AAC"
    stream_name: "Audio/vts_aac_11.025k_2ch_64k_a647_v0_60sec.mp4"

  - tcid: VTS_L4_AC3_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "AC-3"
    stream_name: "Audio/vts_ac3_32k_2ch_128k_a1250_v0_60sec.mp4"

  - tcid: VTS_L4_EAC3_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "E-AC-3"
    stream_name: "Audio/vts_eac3_32k_3ch_128k_a1250_v0_60sec.mp4"

  - tcid: VTS_L4_EAC3_ATMOS_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "EAC3 with Atmos"                         # Dolby Licensed Stream
    stream_name: "Audio/EAC3_Atmos.mp4"

  - tcid: VTS_L4_PCM_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "PCM"
    stream_name: "Audio/vts_pcm_44.1k_2ch_a2584_v0_60sec.mp4"

  - tcid: VTS_L4_OPUS_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "Opus"
    stream_name: "Audio/vts_opus_12k_2ch_128k_a3001_v0_61sec.webm"

  - tcid: VTS_L4_VORBIS_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "Vorbis"
    stream_name: "Audio/vts_vorbis_44.1k_2ch_128k_a2586_v0_61sec.webm"

  - tcid: VTS_L4_FLAC_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "FLAC"
    stream_name: "Audio/vts_flac_44.1k_2ch_a575_v0_60sec.mp4"

  - tcid: VTS_L4_MP3_1201
    use_case: "Audio Only"
    action: normal_play
    codec: "MP3"
    stream_name: "Audio/vts_mp3_16k_2ch_128k_a1669_v0_60sec.mp4"

  # ===========================================================================
  # 3.0 VIDEO ONLY PLAYBACK WITH SECURE AND NON-SECURE
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # 3.1 Video Only - Normal Playback
  # Purpose: Validate video-only decode pipeline across various codecs,
  # resolutions, and HDR modes without audio track dependencies
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H264_1501
    use_case: "Video Only"
    action: normal_play
    codec: "H.264"
    stream_name: "Video/vts_h264_1080p_sdr_60.0f_BT709_yuv420p_12M_a0_v3600_60sec.mp4"

  - tcid: VTS_L4_HEVC_1501
    use_case: "Video Only"
    action: normal_play
    codec: "H.265"
    stream_name: "Video/vts_h265_2160p_hdr10_24.0f_BT2020_yuv420p_15M_a0_v1440_60sec.mp4"

  - tcid: VTS_L4_HEVC_1502
    use_case: "Video Only"
    action: normal_play
    codec: "H.265"
    stream_name: "Video/vts_h265_1080p_sdr_60.0f_BT709_yuv420p_5M_a0_v3600_60sec.mp4"

  - tcid: VTS_L4_VP9_1501
    use_case: "Video Only"
    action: normal_play
    codec: "VP9"
    stream_name: "Video/vts_vp9_2160p_sdr_60.0f_BT709_yuv420p_15M_a0_v3598_60sec.webm"

  - tcid: VTS_L4_AV1_1501
    use_case: "Video Only"
    action: normal_play
    codec: "AV1"
    stream_name: "Video/vts_av1_2160p_hdr10_60.0f_BT2020_yuv420p_15M_a0_v3600_60sec.mp4"
