nonAvL3Tests:
  description: "Config-driven Non-AV L3 python tests"
  tests:
    - module: "firmwareupdate"
      tests:
        - "VTS_FIRMWAREUPDATE_L3_ConcurrentImage"
        - "VTS_FIRMWAREUPDATE_L3_TestAllImages"
        - "VTS_FIRMWAREUPDATE_L3_ValidateAllErrorCodes"

    - module: "motionsensor"
      tests:
        - "VTS_MOTIONSENSOR_L3_MotionEventDetection"
        - "VTS_MOTIONSENSOR_L3_NoMotionEventDetection"
        - "VTS_MOTIONSENSOR_L3_ActiveWindowBehavior"

    - module: "thermalsensor"
      tests:
        - "VTS_THERMALSENSOR_L3_ThermalExceedRecoveryLifecycle"
        - "VTS_THERMALSENSOR_L3_CriticalShutdownWithSuppression"

    - module: "hdmicec"
      tests:
        - "VTS_HDMICEC_L3_ReceiveMessage"
        - "VTS_HDMICEC_L3_SendMessage"

    - module: "deepsleep"
      tests:
        - "VTS_DEEPSLEEP_L3_NoWakeFromUnspecifiedOrUnsupportedTrigger"
        - "VTS_DEEPSLEEP_L3_WakeFromSupportedTrigger"
        - "VTS_DEEPSLEEP_L3_WakeFromPreconfiguredTrigger"
        - "VTS_DEEPSLEEP_L3_VerifyWakeWithMixedInputTriggerList"
        - "VTS_DEEPSLEEP_L3_SimulateErrorScenario"

    - module: "hdmioutput"
      tests:
        - "VTS_HDMIOUTPUT_L3_PropertyApplicationVerification"
        - "VTS_HDMIOUTPUT_L3_SPDInfoFrameTransmission"
        - "VTS_HDMIOUTPUT_L3_HotPlugDetectStateBeforeStartCallback"
        - "VTS_HDMIOUTPUT_L3_HotPlugDetectStateAfterStartCallback"
        - "VTS_HDMIOUTPUT_L3_VideoPlaybackEventVerification"

    - module: "compositeinput"
      tests:
        - "VTS_COMPOSITEINPUT_L3_VideoModeDetection"
        - "VTS_COMPOSITEINPUT_L3_ConnectionTestBeforeStart"
        - "VTS_COMPOSITEINPUT_L3_ConnectionTestAfterStart"

    - module: "hdmiinput"
      tests:
        - "VTS_HDMIINPUT_L3_ConnectionTestsAfterOpen"
        - "VTS_HDMIINPUT_L3_ConnectionTestsAfterStart"
        - "VTS_HDMIINPUT_L3_EdidTest"
        - "VTS_HDMIINPUT_L3_InfoFrameTests"

    - module: "indicator"
      tests:
        - "VTS_INDICATOR_L3_SetStates"
        - "VTS_INDICATOR_L3_StressTest"

    - module: "bootreason"
      tests:
        - "VTS_BOOT_L3_VerifyBootReasonExternalCause"
        - "VTS_BOOT_L3_VerifyOverrideBootReason"
        - "VTS_BOOT_L3_VerifyReboot"
